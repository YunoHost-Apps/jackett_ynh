#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.25.39~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.39/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "15da91f8463a38882f53b9bde53304ddef352185df49e9553e7923ced976d1ca"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.39/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "8936c35fae30b48105dc069fc4f71243e8da9d348178427df1dd905d27086026"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.39/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "25e65401de84bf091b8628b0b04fce35c71ae2ccd490f967b77b0aeb6d61e84c"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
