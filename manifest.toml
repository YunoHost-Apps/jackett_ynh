#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2994~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2994/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "61a11826b2729e972bd7dea3b558ec548c156f2de9baf9c1d4c52062fc1bc266"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2994/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "f27f4d30379a7d2d85b1c203e16df0d538478291b18d580f50daedcb83a6964b"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2994/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "d78d6d0576b5ba740de9c33314f786ab584dc87ba268878b6423efb60106296e"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
