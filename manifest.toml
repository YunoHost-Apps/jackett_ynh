#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2551~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2551/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "496a40592d71111bb0494c3fae9ea08a7ce980efa189e275c801d95b0f5c2ce1"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2551/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "c0847584375386861dcfddcde8390d8b208372d96a722109686ec356aaffb6b5"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2551/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "a123a101503ef4f00d817f729f68c2b176ea228491c08d5b78ee312f255b41a7"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
