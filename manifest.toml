#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2451~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2451/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "e186c360c56931a841a0dc3fdbf5ccafe1fdff2c631f79843db2bb01afce8b41"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2451/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "1f58f503c05b7014f818b330f63dbffa81e391912bf0eec91fad60f4c62e606a"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2451/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "de8090c237f9a49066a5b9da3707ea87913b716df799bf64b4714dae3ca3af5c"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
