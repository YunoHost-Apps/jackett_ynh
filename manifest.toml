#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3009~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3009/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "0f17f22200e04291e0c74f92bfd4f4395cfd7e5ffe7b06835f8b257c26e5a6fc"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3009/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "1eabe662ecc3fe9ccf4da7c6153c52a33f5ec3981e1e64efa2cb4bd1d73be529"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3009/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "31a0b784563f14e2d4f3e6ae3b6e27cc5acdc7001f503db91145c115cbfcc3f9"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
