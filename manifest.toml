#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2806~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2806/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "efd15735b2d08c3395e7c46417f540358af0a1f06242adacc535809c031c46e3"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2806/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "291fccf12cc721eb7c66ad6ad441a348a289b810083ea109060f8ec545b96958"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2806/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "10a30e1e2491b7be52da7005a0f98c973c8be9babba17d53f437093b8699baf2"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
