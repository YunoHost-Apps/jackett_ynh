#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3073~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3073/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "276c0709c334b5eab4f3bce54b6c330c7110615738dbc076b04598cad4ed9d6b"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3073/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "445e4005f08a6da67e2fca07e1c30c0efb2beaa140ba11412b5a7d5ed56ca5c9"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3073/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "4f80d2d5875438076e7f43fc0b6df6b8bf3fab59ef9d54ae6cdd8131e8815d9f"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
