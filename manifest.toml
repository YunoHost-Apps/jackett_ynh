#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2816~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2816/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "07a7ba2f86597b9432ed6240c8042553c862b9d9ce13c7d6d58f1ac5f2cad125"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2816/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "25d940d4b929a79a5ad086c3c23a42d1e7b0ea1ebeb69a27080bb67066064a08"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2816/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "b72286aae4b51baf0c811c8dac5bf37f963bf66d65cc491aa17809d60df35c44"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
