#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2981~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2981/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "9f104a05b37ff2186a2b1fd53d2bc2ebcee5bcdeea96cf422627085debc499e7"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2981/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "272bad3f1b3a6cc1da1a2879b9ecdad0b300e06a66dee9db34a40599bb14452d"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2981/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "8fce3f8552a015917a51b94b9bf3d35673988641373ed345107c261431d173f4"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
