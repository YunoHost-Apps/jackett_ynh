#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2440~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2440/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "ce1a503e156a99cc23739da72f9a6897aada6e62d984f3799c3c96412a2ecf18"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2440/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "34b2db24edd6ae1b764d1f819147bb9945a42cf5c2650507ad07d2a033b5bd9f"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2440/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "447fee9532a9ad14c6dde93d2d4db87a6b088d808d3a8aa7ccdf3d2f70c748f6"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
