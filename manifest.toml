#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2830~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2830/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "f8e3a20c5d0e89c8f900bbc89bb0df62d73f020e1706fad84b6c659d42d3005f"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2830/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "2fafaeeed9d3631e1668f32395a9efa3e84b842d6ec5e9ffc3487cbf8ea6d148"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2830/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "be98a4c1403246d6443803b8e7ec833e6dfa2bb4290435b9a72fa9424dd01610"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
