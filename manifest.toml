#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2619~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2619/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "1cc1253008c67cf975331cb4cb47d69388933956210227e2028b52d4a448bffa"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2619/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "b18760b831e2f6633f9bad595a89d67d2549ce0d2c4c51db5071f18cb2c6eb74"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2619/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "8de4f088e59f4e734dfd935c6b039608ab61203a5c5dfafbc7ef449a17cf3059"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
