#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2389~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2389/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "750b8a13261920a0ebf84f79981fc806fafbd0df22fe2eb5724981d76308e359"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2389/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "51ae6d167deacee7b4601e8d2fb4120d2344dfa89596df9c2347095cfd5fdb57"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2389/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "f068929dd850189ca8249857554b5b80af3aa9188799e75d6cb8f581daca5f41"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
