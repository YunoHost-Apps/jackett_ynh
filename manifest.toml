#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2586~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2586/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "7f0f2fc1e3ec3ca0b85d1efc875ac197c9c97e7179ffa9058a100069fef287ba"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2586/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "d6bbc9ee8ecf1d634896be1d768f0ef0ac84560e9668f1b2b2acb10548ab3b58"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2586/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "cd16d8922d6816843562a4109662875ae5daa14d4c0d0a48dcbfed9db4068e21"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
