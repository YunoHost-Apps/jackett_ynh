#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2663~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2663/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "738886bf1f9b17ef46199c60a422ef5d294662d713a919403a78d66866289837"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2663/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "d88cb7f938602589534b4b979cca11cda7ef8328b564d9a8362e0c8f409ec941"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2663/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "ff73a0d57124c785d4c54c69f66da012ebb4ba55093c093e37c66d87106a13a0"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
