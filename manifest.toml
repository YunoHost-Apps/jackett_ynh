#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.25.48~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.48/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "b7c21c707836d75969638be4e839a2bfc82d93b8fd2c7db159c9884be5552158"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.48/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "1f8f5afc371d9ad287e508e147b23df948fbeeacda650663493ffb77ca792f52"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.48/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "e8b45ebce3a32fc33de78932634686a3e744995fed0b93bd645bf3e0d932cda6"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
