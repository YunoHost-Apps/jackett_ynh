#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3003~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3003/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "0073570ca568d8cb2f6c14931e319262aa37f61c8f0754f79c896e31eea1040f"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3003/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "b407a1ca28001edefb6e87f15fe36f394f654be058507871bd5ff5233958e172"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3003/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "b1bbbd8288271cccfa00df1d61d55666fd881745dbebd9f89d5d7b1834720645"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
