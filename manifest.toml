#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3081~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3081/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "08423af8d44fe126483d160726a3c04334d8dae9348fd83bd6f9da869bd76660"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3081/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "251085dee5bc65900dc5b89b6bfe57990b48f4cde871f05eb619c60a0de154d8"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3081/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "9bbb95a6b388ec0d6b70aa939ea7348962f9939eb9718e65805fd46553099ba5"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
