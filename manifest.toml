#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2680~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2680/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "31c11372a8c66e633cd4c72d718fbb087182fad621790c7b7b0e8bc9117d79ac"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2680/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "e283482f042bf875b4d89bae68e3dc8390e4c15e8dccf6003e738e971d7aba27"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2680/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "68878927a09208560a269a249ca074320a58065dc308aac04406b6bf032f3779"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
