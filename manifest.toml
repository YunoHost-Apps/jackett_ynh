#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2489~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2489/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "311577379588ccf28ce90e312c7e9b612a8f1f6e25d2e0900af76b281531acc2"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2489/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "adf1ed326e07dd3ce91bddfa19f5885ed580e4e913d6d7a5d77a6a85fc6ac77a"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2489/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "4bcd4f811a7fa9428c2a1d7e4a11fee0b71b029953593b2ad6ab716c526f54ba"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
