#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2233~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2233/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "745b02076e778dd8fae8d4167182af7c3e04943dd9f12d776a0457ca54728766"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2233/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "fac340ef1bfc465ac873e999cbd22bdaa3478f8c3de299e7458437a0ea58edbd"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2233/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "ed4f1467c033ff2f4824fe48781ca78d486b838655fd70e2bdbec4aebdd75052"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
