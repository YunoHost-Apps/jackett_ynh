#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2219~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2219/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "0257434f9112dc21021d0ef141b1a6698091020e2bc89f9cbdc741e7c496de8a"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2219/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "b23d982fba879465cff2f5343056bd4e3a468b68068380f6e78b0a35f01fa525"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2219/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "aa1c91c1d15de09627dccb09374d3d5ae03d1929f7bd11176d41d599b231cb1b"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
