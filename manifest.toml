#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2554~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2554/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "27d911f9e3b3ae5892d00d22bd49da8b5862d11eaa4ce12068a44b3c6383c2b6"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2554/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "9ae7df57d2c2022376d19c53337824b4b189dd44be9d2606df6ee9039f8041d9"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2554/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "5ef2c7d0c50ec2261d4e7dab2f743f81924d9fcad1cad1510fae87acc70ff7f9"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
