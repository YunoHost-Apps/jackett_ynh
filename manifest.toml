#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2327~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2327/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "3b9b2bb1975ca22e06ebf2241bcdc16493ee87511ebf102732a0aa6c4616cffe"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2327/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "0360fa5db7b7620cf7622705022ffb9560c73f3def826da9918763c7ce5700db"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2327/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "10389d2a6bd0b5b572c6439310b6498cd3dd6c6ff93b6d2a929ce711232666cb"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
