#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2288~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2288/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "747d1df1fa1e5389d8e60ef74b4e7ca33b16bdbb977694d46717e3ffcfcfce3f"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2288/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "58d8620c2e653d28fe797b4b4189008a106780c73f46b197c27d46fa32a5af77"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2288/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "43217943068798f1d9389fa7e75f78789e7672796fc32550c317e46af898a6dc"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
