#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2257~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2257/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "865ce8cdf1cecf1d2a75b2b592c16d7f3823e1c448fc067116bd75ffa4b693b0"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2257/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "a7a7021afc3e54456bfcbbb69e9c70fe9d085d3087691ff6915ee3bd09e2c8bf"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2257/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "01d0165e9ef06e9507cf357b159663d31a5adb7f0f5c82355b3219308eaad537"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
