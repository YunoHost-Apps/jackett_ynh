#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2544~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2544/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "f7ad794ee61875c2b4e6e2c5a1c88abc07110854fdab1977300c37a915b72033"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2544/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "37cbf2428338781a4f05a05375a5554790b94b60a171f9d01b3abc4f79e441f2"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2544/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "e228237ac58016c4a4ea4dc5b26d99721b6cc51005c4c5b397ca6386ab865a39"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
