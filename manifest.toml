#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2651~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2651/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "e0f31e6086a1d658df2f0ab1025b438e7925a00d4a1691c4c30d23c9c068398f"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2651/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "c37da7af354e8291aa0510cde816aa41dc5a7791a0041bdf7b3d1e14b75626fb"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2651/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "f3b78994f3dd519d35431bf9a24b831f4c6ddb8d80e4d2ea0810d9bb3e65bdd3"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
