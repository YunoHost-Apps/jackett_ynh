#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2800~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2800/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "7475e3ea6a6b4aa08f91e3ae435fecc795ce4f968dca198d810809f4ca80ba22"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2800/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "7fe20d91141217ef9232e26338c7cec3d9f14755da2ebe9810b3d282ff24f995"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2800/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "b41bf9f92460bb5b19fd03c6ed05e85eb7d0c805be4bf07ca8c48bb3174a82e8"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
