#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2213~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2213/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "5fe6daf1e54f791599b271d4b98b47b4eaa8b9b6c1d57c89b8d7da3cc89bd0d8"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2213/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "e3d80a84d37b5cb572f835bd4528010f5e1f8155ca6d6406eaba0e3e416d277f"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2213/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "8e17bf27aa80a8418e4bd00ab1f66d293f8119f3ad326b18a2e47b06119a0534"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
