#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2531~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2531/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "4e7411b7a4ec63f25f22ed1ddfbb5a4972ccfd2323b7a5677fb83922a563fd52"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2531/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "0992643e8ebf59c1ec8cb1fb2f0fe7f2b482bdb8fe1a73580b51ea2086dc6aaa"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2531/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "465e2e85e0be4651bfbd9a193ffde8fac88f1ab1ef861a5298fa51e29ddce788"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
