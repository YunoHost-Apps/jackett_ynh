#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2475~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2475/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "aafbb22840d8382957491789d929613bad1af2709a6a55179290c01567de36fc"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2475/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "52446627d08d92c6d35f40163b0f530f072efee1fcdf04abd82c85703bcd9046"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2475/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "99d7502e27ae481f16d2eaa87554735f603c48089696a4bb47d6149c03875ba9"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
