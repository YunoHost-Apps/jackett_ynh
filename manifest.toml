#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2517~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2517/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "3bf1f5541bf22558302d08ef0941c6b23f9de7166b631f1d9ec704de7e20e53d"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2517/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "a8b8f10a09d09296b86b3e82ac4c5746238fb7699719b523242f1484beb40b53"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2517/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "e9bef647c107562c50606e1e004aadb600479d56d59ebcafd37b3f1e610cb385"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
