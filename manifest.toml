#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2813~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2813/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "6667a17d344eef3235dd5cb6c09be4cf3350f4d6c552ccf5b81c739b0a649e02"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2813/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "bda9f557275059751216e62b3ce4c1c30bd10bbde6372ddf9b22e50b1d8857ff"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2813/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "786998c8b8cc29df4e7d272d5d5678fb003d48fef68110f589919f11d3f407a7"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
