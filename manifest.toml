#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2398~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2398/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "cbb21f061d2bcca02330e486b3d8041c24f5c425d4b30d8a21a744c22709d38b"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2398/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "02bf05ffa96cc39c79a1c38efc3a10fb68d5daf416496b436b6c5866cced1050"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2398/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "01149ac2275549851d9e027a9f2914a3329176352e5e05e1fd5ce1fa3b89eead"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
