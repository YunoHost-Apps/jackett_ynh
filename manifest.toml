#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2826~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2826/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "42b7d2d3e1cc5bf700357bd73520b947ded581d36ef1383f8b7a62a9678325b7"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2826/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "8f8bbebb752375143a1aa5e83af26ad3ef0e6b834cd3756e5d5584743f90b3c0"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2826/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "149b217465279f947fd62cd650d46c25c4673e9558238673949f3e007330ec19"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
