#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2977~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2977/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "0a5e8fa93cdd58539fe2aecd2a90ea4022f1838f1bed3f8e8d8c6d151f62a3a2"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2977/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "3a0c2232362b01b2a360f7ab927ecff1c47e9aeb84666f80e4b8eb4a642b6021"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2977/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "24dc3b507fa17dabc4e245acd91ce6d4cf1a77150cf3cce8bf04ae4d5359b5ba"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
