#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2184~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2184/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "d095cf65256c12d2b1de9477af857d06e6b86871a1ed76bfd77312b3f1a7ab24"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2184/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "5a46edba43c905e47a47a0b5bbab8372272ddaab1f1a123d9273dc672a0d43ff"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2184/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "4e00ec64f11fc50bfa5559e75559d7bd72b18971da143e0a93f891e8864e8561"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
