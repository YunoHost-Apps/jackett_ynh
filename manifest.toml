#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3078~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3078/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "ec546d19da85974c63f3398619a8f5984239d5509962854d8e3cba13b81407f0"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3078/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "88af67f2fab0572629ad04ff2cc3f16dc1be27b3377d8b13be39a4654c669fe5"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3078/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "8170e9dca8b0833f9db2b0235acd0321e9cbd472df858ddbe231913e8d9ffe28"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
