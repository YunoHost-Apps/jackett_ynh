#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2414~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2414/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "525f160bb3efe444e1fab11d096c33e02f65af22f76d0f56f076bd7f5c69b4a9"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2414/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "2b5173f34638d690c010ed2ba87ab7c69004a68d5ea69dbe2cbdca435102c69c"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2414/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "ad73f18b880b2a6fc8b9d0b151f6044b0d0764fc29e9e9907b8c29a045cd7b39"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
