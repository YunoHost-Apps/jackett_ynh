#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2685~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2685/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "40d4af3f14de74c6ca98e990419f3bdd7765fe7b4a52501385dd554a2596ab63"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2685/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "49ba1f3abca9206e01a6aa0fb85227fbafe2b4e0941fc30987dc0f94ae0fdbe3"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2685/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "b5aa70916958a80e3d9c3fea28dd1b3a9d83ac8d00606378c5d0af06e4cf67d9"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
