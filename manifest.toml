#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2246~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2246/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "7407ee26c4f75a0aeaf08b3a2fc91bf4e3ed2b6dd3277395ac2c05e8d148e12b"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2246/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "c0389efc223f9dd0336819b1ae5fd1f00d342d92e0ac1f3cbad941226f126df7"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2246/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "9c52fed4c1ba881ce2304854f31bf6ce11c462c4515e335a8fed409f211dde1f"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
