#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2668~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2668/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "5906292a39421ecfbaccb34ea22e0c5141ccfa16ef9ae82170309301476005db"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2668/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "31002c30dfcc4b624e19397f0b40d8df6f768ae8b5719d1f234d3f1ffe79dc30"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2668/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "dba3bb9ac3de1fc034aef1fab8d427330c46b84b2093f04e8c7c044f796724b3"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
