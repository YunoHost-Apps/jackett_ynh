#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2196~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2196/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "62449139b93297bafe37f1ed9af1b6acb727528f7f4cc9f7b4dd12f3fc3c0bba"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2196/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "4400d2235c813f8d5773cd080400b3781b2973c481ea8b6f1012d8c9cfdaa50f"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2196/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "7fcc99e8ca902b54b18d05cc6ffea69a5db55b7b37fe300d14a88a10344b415f"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
