#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2315~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2315/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "1f18a3cb2863fe5ab81383c5169916b2413fa189f83eeb78d69f3c56023167e4"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2315/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "7551dfce72b78a87e80280675d69d74097d4386377c0130718ab626ef460d0c8"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2315/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "d28ff976290f3523c7dd90421dcc60a5920a87f8dff4544600262f7b7ebaeefc"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
