#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3055~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3055/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "82bbca2fa004bae14c8087f06e9004e432d0db9bad74f53a44a6cc4eb57c71cd"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3055/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "39ba66d2368c3560528f1b9ec3d37f9b3b9beb3fe196f155dede946bc7635958"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3055/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "be014655bf2795bd3391e5ed98ad0bc0d670665ebe6c770ad2788b13e4b1b6ac"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
