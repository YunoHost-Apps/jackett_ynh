#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2890~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2890/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "801f35f56f940c306e457febf26fe7f7c758106ff57aa32d6d55104cc324f712"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2890/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "8af17bfa2a3bec5f97545e66a082d309a007e6785dbe685ff29fcec66c6392e0"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2890/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "05a0b6ef8695f0c86be3ba3c4e79c0c5d0f9aeaf5e607e4baf92bafda0e13ad3"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
