#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2949~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2949/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "ec4e54aa630adce6726b1d8d33e13f712f4944f6f6a39a1e01f5694b3fd8a161"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2949/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "d4e7350ac14b944ebc7e96721e04f1b06b21bc9e7710a5a137cdb726ba2d9972"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2949/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "cd4765e4040226cb53448903f6cea7d015d9f22b32a4c159ac7aa0875312756a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
