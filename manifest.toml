#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2381~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2381/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "1a1a3b48e3cc09165605017b79ed00e82ebcfafd0bac773c9b4d6b9b497574fe"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2381/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "cb64d85ebd13cbfd77d97cd35ecce73f62e5d4bc5c3707cd2058afe8d41db6e9"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2381/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "173b90fe11e3d0c019fc52f24d608ef774d8d66d0e8afd4dbc0312ba5e0e08fa"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
