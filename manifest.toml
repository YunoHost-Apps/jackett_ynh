#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2251~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2251/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "2bbb86bc18280feb080ad6e66fd931bed82444072b5d833bb11e28dfe3ab91ce"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2251/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "90fbd1ddf9d85106d12a6f64b18365bbe0abba3926554566aef46a50bf46834e"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2251/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "36c1d3fcca82d88407b085fdab059a97291071f34026ba53ed1bdb8801e6fd30"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
