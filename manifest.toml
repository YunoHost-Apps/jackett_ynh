#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2265~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2265/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "f34c65eead7085f25be7389d1b06c61f50f9417fadcdcf0e4c936e0a6d40deb1"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2265/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "71fdd95d17b4e68cbe6c2bb3b9ba33abb44245bfc56f7c4e79cffd62eba7c8f3"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2265/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "091c0e278bf057e9bfa0f2c39feb3fbd863b1c132fa18855c5b8516640fe141a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
