#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2503~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2503/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "6b292e14c090b539f9a1d944f88b9f559b3bf9cbe788c1c8f278f7213edf090f"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2503/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "1acddfe30bb3835d5099ba112bddce579eefd9682d4d18af78eed5370fd71de1"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2503/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "e36e78b2ea821d404cdd1fc6d029878989f2ffa404dfa617e446fb16bcd87a2c"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
