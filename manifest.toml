#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2558~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2558/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "51e2b4978a6f61e83455dfa24dd6c82028e84b56120e1beb3d7470cc59926050"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2558/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "f4983d1300a55e91be9d1a22b0bf74056661df74f6194b75f1e9bc8400449ee2"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2558/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "e0d9200cfda33c1f6c38bc6f4f7698d7a0a4663aeaf18c94c9be593be0afaa11"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
