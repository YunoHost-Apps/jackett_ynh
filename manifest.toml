#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2918~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2918/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "e39cd2df51b042208807959ea97ed1ef539c15b0a0a9a70820d61c8808890432"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2918/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "b110712bbce1f6d39c2ce9d809e242a21dcbf1c563960eca4edf11a738ed2352"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2918/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "85671aebf43df4f5f012fae86d1853e5acc4df1eaea0a2c1655cedd27b766627"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
