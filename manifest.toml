#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2457~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2457/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "6c166af1c548877a79639adb9e741aff818bcfe2694364544ba4f36e8c2ac4ad"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2457/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "f59a2929cea36e9a430e08bab70313656e460a650e6e1dd374a8bdc067f879de"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2457/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "966a457341c848ffa3783fbd85cbb84de3ac911d6f7038f9bbebdc29f5878e8e"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
