#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.25.20~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.20/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "5af8e92cf69efb54f5e7ef2ec897080102a8eed73d2af52200cb13d6387007f2"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.20/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "bdda65fe4e80fac5787ed1d9ed1d30280b70941b56501c8967a5930bcb8f5818"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.20/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "86eb7a2e49f6a30af72c65683d9f43ba8bb734876dcf8fafe6dea7df402d5787"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
