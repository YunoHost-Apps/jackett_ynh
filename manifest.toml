#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2206~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2206/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "159b7cec2384f1c154b8aac77390bde785252eddbd6e206fdfe7a8bd7c6e4323"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2206/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "35580542cfc0eadc2da79e1cea40177a8a0d2d49516cf0c7ecf23842ab3523f9"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2206/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "f63f1a44ad6d3280248fa1fffa79586871ea86735c6aced9044437d057ff78af"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
