#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2205~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2205/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "6ddaa9242f3d38b6013d76a40a1998ee86bed4467a3c3ff19aee36e1f4d0af8a"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2205/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "8ea2b124957e5e2d5a1b13a0fa31648fc8623ad3b502c079e9a36cdea7b776e2"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2205/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "81e57c2822f8cf2a8ad7f86190aad502acc85d011b36b7916034004fb0eae865"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
