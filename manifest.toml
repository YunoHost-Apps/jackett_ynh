#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2200~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2200/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "ed16629bfc2db09ff195b8c05ab38484f1f47edbe4c307c601f52c77222e9f72"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2200/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "40b7dd17c8c29d0b14ef903a1c9500065fddea6e1d971573816c6757b7a7cfe2"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2200/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "17b6ddd724cbbf05309d746878b93db5e15a971b9f8fd3b3b5b6aff43d57b4a1"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
