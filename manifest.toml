#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2601~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2601/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "02419bee72fafb149dcaa2c55f3aa354f0e2fd6dcf10cf2af665aaf1fa9e7e22"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2601/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "5cebcdcdfe57230035807d431ec213a8aeb82fe534442137d53b7a25ac9efba8"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2601/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "37a9916f718cfba8211fa89b8dd4a8f1e122b8b41a064ceda337fd2b31806598"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
