#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2467~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2467/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "bf85133a7ed4d09c15bb3056c760f7a47c76ad8dff939799d84cd61d10f5204c"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2467/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "5ad1f5f9686ea4bed7608f5ce660da9684541bd8b266a70aa4e6a5e3c5dc71a3"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2467/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "629f6e38907f9b356193dcc43e0e748eb8be3a3da7060af035331d605ee36b76"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
