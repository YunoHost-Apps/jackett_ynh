#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2434~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2434/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "36dbed64a4de3dabc2db6f8916a3a58a55505dde9f6c1a9bb389d7b39980ecf7"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2434/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "fc22cd8354f105eecef2d330c8a274e2b4b4666c30fedaef769e01da380ab7ca"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2434/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "d0082d36aaeba599bb0b148698bff941909858b21fa14e7f7528167aef5b5aee"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
