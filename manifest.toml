#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2404~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2404/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "f74872ac6ea5fb64e6d54121b017482cacdbf99d2d25686851858a200c27936a"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2404/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "00617ef94bfa14ec215e74ad9741feeb41047fb6a4bff465e05cc2ae47cab65f"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2404/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "8105e66f6b4f8e457e89d30a5c1173be1ea902b1bd77a0aa2ed8353baea79aa6"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
