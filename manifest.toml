#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2527~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2527/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "13748450c3762a9d095f6959eab50b0d209cc298d4103e81f3144a80db8bd709"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2527/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "c3f47439dacca6d4d8a66145da828d5a445e278255f3c94a5c534491bce8dc44"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2527/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "9ba2efca0048c96d0242c4c0e6d0876f8f3d26f7e13070e6f6583c7a50eb3c15"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
