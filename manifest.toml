#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.25.40~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.40/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "d3daa7bbd0d5b15927cff0d09d6314512491e2c7feda2f0d188f0b8c533b202e"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.40/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "300631388886501010dd90512f67707db249c4c9263fd1c259cfa994ee81ec7d"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.40/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "91b868f978153b2d0d020d4f7d86ff12a4e1a6fc891a0e104abccc0acd92eb6c"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
