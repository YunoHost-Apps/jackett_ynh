#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2627~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2627/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "563a791ba7f85e4cd8278eb96e68b80d9a6650fb530f89b0b64df797bebcf6c3"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2627/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "c4f881eed8f330f2fa8fd0d65b3a2f19c5b3c7e4e5f1628ffae05604a0782a96"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2627/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "9ab44d4e07e46f0fb450b16e79189a86591ca389f5f835c1374d3ef14a4fe7fc"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
