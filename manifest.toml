#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2910~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2910/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "81cfce79fa53d49fdd16d2b91488c1cafff8c079eecbf239ff06026d5351af1f"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2910/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "02f8e8bd9f3108db51f16993949088f317d606a4949dec7a52236fcfafb4f975"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2910/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "9d8fccaf0221a536580dff6d85593e19d8f7804bf2913c8553e5f400a8655f0a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
