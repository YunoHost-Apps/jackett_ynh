#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2644~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2644/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "2b6507aa748161fffc8669b37234ed95e9dc406031e07600a802d90d7a17a5d6"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2644/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "9bbbb7a7d91791343add769225b5e8d405ef4be698323cbbc53fec31efd85ddd"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2644/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "b590e948d0680fc02d6abd1c331f5721361f1554d2aed982cb277e5b61e7218d"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
