#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2985~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2985/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "912aa70e9e83031c9582f776617e29db6159803d53199cf54ca4ee03913ba95b"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2985/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "b517a03e47e1b7c20d33d5637394eb233547427e3461b66dd500b1110d908ea0"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2985/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "36f5728480a946bfa74f6105a2c7ea2ece8743815cd4861af79d97f3d9fae97e"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
