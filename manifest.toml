#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2865~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2865/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "e7810a8e4f7a22fa0c6a5859246d3f5f0fe3e33c45f9a9ffd14992f4032b77c8"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2865/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "56f46c7423f0064eb9e2da6844c3d61a9df1247887cead5ccbed711e38ea1405"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2865/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "d84cd0113a3207669c26e74cb1dceab116ea2189e6f73afa5590a49aacfd0c49"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
