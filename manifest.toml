#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2307~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2307/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "3900d8934199a89cbd262a10ddec2d56f936cacc9573a5f987a510078afc13bf"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2307/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "5fcd583b7875c36a8a87093bdcd7aa9fd70bf08e71ec4cc995661f886d702a98"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2307/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "e40c842051201e74dc20afcc49221297d99a4df78d25fd30592284536858123f"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
