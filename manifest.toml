#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2419~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2419/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "009e0e498452fb2fefd571d81e350271e78236c1c82ebe9a325a64757b91cf95"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2419/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "0501434ddccdc6676274b1c03ecff83cae787ae17ec1bc127395bbcb3f1a0dd3"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2419/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "56ed6876a2ed543c39cae6619a1fbfcfe25d05b62333a474c95ecd9cfaf0ff83"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
