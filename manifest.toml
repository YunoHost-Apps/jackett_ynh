#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2342~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2342/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "cb68242e96f0a6d145022b05810677505f658c927dda2b5e9abc552e86c24fc2"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2342/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "4f89fa15424421e56ba2bbc60bace2d71c543c8bc4b80e28a3345d571ee877a4"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2342/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "7ef9647ca5200419934e6555ab8a5de9ea74c7e1bdef938cc58a2802f95190cc"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
