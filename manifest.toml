#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2572~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2572/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "384309e5ef97ecf25e51e02ebb179aedcd4376bf01f558911aa310435e94d896"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2572/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "52f22be44d133ffe073e1997eafe10511c19dfba68a0788c7447ca6a8f56b3cf"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2572/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "2f3f4ffc93ec93428ced0c262dbc96fc392e37c152ad108e60fcbeb425000e4f"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
