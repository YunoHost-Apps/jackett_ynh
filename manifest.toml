#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2875~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2875/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "fe1bec969669e29c6e73f074370506e0ae2ca53104ed3ca34b76906d0eccbe77"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2875/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "134d35917470000076ea6a78b1cfbfc1a5beee2569899dffac9ba115c40b7f1a"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2875/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "da919e9f89a019ea7d30aa51f2aa20a12159db86eefb5d35ad80e9dec1d6ad10"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
