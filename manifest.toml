#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2961~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2961/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "6e07747a05b7ca8728d0b279b83b132b6a2f1f0333e2bba5ecc327916e143b88"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2961/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "3a3424cb1f2c9994d4767ab9ebcc8719fa0d2cc5773a7fd47191f47e965eb263"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2961/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "72413a6228bd3acdbd1d61dcc2c8964334462b3a516ea422cd8f4dba29701e82"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
