#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.25.28~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.28/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "ab3d75f516d967f1641a695afda6854e14b0ce79ce70df161a36396a291d7082"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.28/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "bd7b718203fd86f488221f3dec114b3a03e657a0fa5708b8978f6b31fbf509de"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.28/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "00a211b9d657849965a8b9671a72ddba25e9ef73acb9829b062d02f76017590d"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
