#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.25.8~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.8/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "4d55ae2069f6b1ea6dd9de41bee5867a7ed6c7c6600832eff01f174c85abb113"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.8/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "80ff5fcaff1e0d87604b34ac4f5d1df845681b0298377d1d0a49c15d87732189"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.8/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "cb0f9fbe97a430f1641781b11e7bfe1a125538344f7fd836c630005456f44f9b"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
