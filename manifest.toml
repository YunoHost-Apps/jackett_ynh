#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3042~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3042/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "e34fae81e72afc702b4731d1b9dda6032d29d30117cc883b6aa8473805dcaba9"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3042/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "385b6c515c91695b8768e31ef415b035e95a6ea6f6e5ff5728d0932ff10004f2"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3042/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "805640848fd4caf1553f039b9e0f08434ec32402abf75ce419d00bc6ed7c45f2"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
