#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2581~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2581/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "779e181cca2a83a0be28c3d5619b6d5804eef53e35d5285445dff841cf378bbd"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2581/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "368dd1feb11a8dc2ee64618406ce8c17159ea4b224b46c57411f010277b9f45b"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2581/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "ba6e09c0c7a7a072cad9b0f7c3e3b4914a7b61b12e55f4926f2bfcbcae09e228"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
