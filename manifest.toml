#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3065~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3065/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "866cd2f8ea7e8b7a06898ec5ce1625c22bd14051a7a2ff9c03ad731c526dba78"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3065/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "bfd7dd23705bd5eb2a2cae48d1830cf18b781f006c317a767b6e23c2a09a70d0"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3065/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "a267fdf7296867406e77bbb3a77b5d3ea684cdd1a3b059d970f625c81303ac84"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
