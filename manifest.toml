#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2492~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2492/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "45661bdbd2d6c0dc70f438e38e9b7f1a18fbf7f2e7c670a34170c83504bd77dc"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2492/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "4e12dd93f060dd5c94d93439dd71b2976d121daf0fd646afe6edd989a05b4dba"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2492/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "5c1d1488b9b6fb8eceb582d89c8325de9f1d0fe4deaa350079669d5835b8a249"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
