#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2884~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2884/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "4aa5e791378b35e59b003e331d49856933398b60949ce42890a5bfae394a4093"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2884/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "0fb89a7dbf32468f6f4177cc28c1a505bc9daf5a252061876cedfd3c6b0e5955"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2884/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "65a70a00ae41036531a8833c7a46e484b805511886788e64cafd152401570624"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
