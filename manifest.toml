#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2793~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2793/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "70f870787b2f4c2c330408f2dc470638b839bf386c81e05f8266ebdeebb1b1cf"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2793/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "f611fd736a04c12da2f70028066e56e10a69e8846df528d57fe60e6b9135c6a2"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2793/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "da3f3c5b97a2d53585c8ce8ab1029292d9f65cc54d0e06ed18336df4e49d357b"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
