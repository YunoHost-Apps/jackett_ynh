#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.25.24~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.24/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "f45d4e0fc10e5f5e0b4b51f5cf5141ac2db93bda6280fcbeff740ae47359703c"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.24/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "911e20716b38444f01630e212d5135e528fd3adb301b2d09c6a81240cc0fd530"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.25.24/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "203bf58f58ebef9ccd95df4b98e1eb4f50791ec43bda9912541398e7bbe470fa"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
