#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2756~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2756/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "20b4987b14f74f77a02bf3f14dee839fd40580a66b6574f3bda2bd95ef02a15e"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2756/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "44d6c0af6f093c4391b9870334b9209a140aef02038e66e01324c4591a69ebe7"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2756/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "919056a98d5718d87bb94a1f7f325c6400659e5dd7166e43c40fac094eb00e0d"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
