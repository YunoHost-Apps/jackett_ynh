#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2277~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2277/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "7a3c974384d6e07fad86bb837d50918b22324d4b1ebfd503b495efb8373c64bc"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2277/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "d4e447dbebfc81c662711315a811a58c096bca12b89e40e6952ddff6824be0da"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2277/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "ebcff227ed6655a14eae454848d68199cbbac822b63d8f937363806bd585f7c5"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
