#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3047~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3047/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "9cfc787253296ac66e6f4a936fabbabf9fb89e0eee63cedc3c3b3a3679dac67e"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3047/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "dcb5eb04a9fd96aaf2cdcc4eb1d7dcb0c810a7660061b29a62d11158a6b08ea2"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3047/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "5b977daef5e3c0c19475133b07eca7d91145ef0e73d21bc878dfc808fbd79d98"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
