#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3025~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3025/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "c91fafb614a1619c3fe1bc1c9019df857591f7f75d2598dd2a70f76c2252cec6"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3025/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "6e12a96454acfdccceb704026a735b0bd74c78afdc49e287069b360b25a02c71"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3025/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "49263bb024365a9413d1ea86770d4831ae48fe5bbd21b56defdeb55132c795e4"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
