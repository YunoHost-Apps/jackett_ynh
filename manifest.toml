#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2304~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2304/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "cbe7adbc2970dd4398309545635b347bd58b24910958ed6ee1697eb6c5d50611"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2304/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "f51a150007ad524a447b2f7784a5d6c6eee88fc363622be0836a1c28e118d00d"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2304/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "30ce17e146565d6ba8bca302c1e0403da6c93a49207bc8ae51a4ffd4b7ae2146"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
