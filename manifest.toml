#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2810~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2810/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "982bbf5e4fe05881eb0a1364e484d83e094b89a1681ed3f42f49638980f8fb26"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2810/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "2fed0cbc6f43a999b99c877db5224b1badef7633bb9aff87680909893795ae95"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2810/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "b266a9f80e2aba1a33c765761516e334c81aa27427d2e661db7a4cef3ff99da0"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
