#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2335~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2335/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "be02b2202c94ed6959b016942d4cb95d4cdcffca195c266093161f302688e28c"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2335/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "2ba0d981289e7ab462b3b4b2204f5353ae2e49c60748a761f0b8ea1d203135a9"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2335/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "4282078b6c9234480e36271d90946b20e2484e943e5c7e66cd8d1d8e43ab6dd6"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
