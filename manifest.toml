#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2297~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2297/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "675eae0434c5898cff99c2aaca1ba610162320cb02b1d4c21abf446e3759d47d"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2297/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "e307e6957dad9280fc91646e68c673cfc349cb96b8074b0fd605b9763e336f02"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2297/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "70b04b71f27748925eaec41f788dbccc1ba4c62d37c1da82826211ee139896bb"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
