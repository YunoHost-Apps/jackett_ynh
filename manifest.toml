#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2670~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2670/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "8bff005583b7c6970b1897f44a146227d2dcf32098a16c36f170520e6d393192"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2670/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "4e82b292f6889b664386793bbf4bb7b4d94ae27c1c03308e06fb3c4d0951d1e7"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2670/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "8fe8933aae9cab4bd2bf2d73cc0eb50a77121738aeb86af79c745eba0ce1c09e"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
