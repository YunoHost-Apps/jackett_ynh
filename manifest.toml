#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2850~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2850/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "bdf3712b56fc6ed8c205bb6973e07a268183037a81398d35929d6302c89db450"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2850/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "5b4b6e73ef2723ab3f35a533b453bf2b5e7430e03dc7bc7a7bb7c48a674c5f34"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2850/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "e8a8d9f727ace7ca509248bdeea62a4ce8a1cd96f1a38108d84c7e2d48cfab66"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
