#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.2254~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2254/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "37d5c3db2fd5c48508c2c0b645112e855074bbac7627530c7cb7acc1d48cd7dc"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2254/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "01b4a441381ac88a1ba487c4e80347cdbce94400f8ce167eb8750162e6c7b344"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.2254/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "6bd46ba0d03ebb5eaa519d54886d35a3b32c00bf07f4a3587183cc6217875f49"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
