#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "jackett"
name = "Jackett"
description.en = "API support for your favorite torrent trackers"
description.fr = "API pour vos trackers torrent préférés"

version = "0.24.3030~ynh1"

maintainers = ["Navan Chauhan"]

[upstream]
license = "GPL-2.0"
code = "https://github.com/Jackett/Jackett"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "200M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/jackett"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    amd64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3030/Jackett.Binaries.LinuxAMDx64.tar.gz"
    amd64.sha256 = "715a3d5c1374d6f34cb6756c9aa90ea47c1f63e94cb0b556e2396b49c5140c40"
    arm64.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3030/Jackett.Binaries.LinuxARM64.tar.gz"
    arm64.sha256 = "630da3bbba61f723179a316b0ec65906ca03f3832e0ef491aa20bdb7e5581bc8"
    armhf.url = "https://github.com/Jackett/Jackett/releases/download/v0.24.3030/Jackett.Binaries.LinuxARM32.tar.gz"
    armhf.sha256 = "fea3263f028941d127261e9af43a56655c9e4d3ef2b14c2fcf8573eafbbc5ea9"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^Jackett.Binaries.LinuxAMDx64.tar.gz$"
    autoupdate.asset.arm64 = "^Jackett.Binaries.LinuxARM64.tar.gz$"
    autoupdate.asset.armhf = "^Jackett.Binaries.LinuxARM32.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9117
